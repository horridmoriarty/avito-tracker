  document.querySelectorAll('#statsPeriodTabs .period-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (days > 0) {
    const today = todayStr();
    document.getElementById('statsDateFrom').value = shiftDate(today, -days+1);
    document.getElementById('statsDateTo').value = today;
  }
  renderStats();
}

function setStatsPeriodCustom() {
  document.querySelectorAll('#statsPeriodTabs .period-tab').forEach(b => b.classList.remove('active'));
  statsPeriod = -1;
  renderStats();
}

function toggleMetric(metric, btn) {
  if (statsActiveMetrics.has(metric)) {
    if (statsActiveMetrics.size === 1) return;
    statsActiveMetrics.delete(metric);
    btn.classList.remove('active');
  } else {
    statsActiveMetrics.add(metric);
    btn.classList.add('active');
  }
  renderStats();
}

function renderStats() {
  const region = getCurrentRegion();
  const listingId = document.getElementById('statsListing').value;
  const content = document.getElementById('statsContent');
  if (!listingId) {
    destroyChart(statsChart); destroyChart(statsBarChart2);
    content.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 17l4-8 4 5 3-4 4 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div><h3>Выберите объявление</h3><p>Выберите объявление из списка выше</p></div>`;
    return;
  }
  const listing = region.listings.find(l => l.id === listingId);
  if (!listing || !listing.stats || listing.stats.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 17l4-8 4 5 3-4 4 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div><h3>Нет данных</h3><p>Данные ещё не вводились для этого объявления</p><button class="btn btn-primary" onclick="navigate('input')">Ввести данные</button></div>`;
    return;
  }
  const fromEl = statsPeriod === -1 ? document.getElementById('statsDateFrom').value : null;
  const toEl = statsPeriod === -1 ? document.getElementById('statsDateTo').value : null;
  let filteredStats = filterStatsByPeriod(listing.stats, statsPeriod === -1 ? 0 : statsPeriod, fromEl, toEl);
  const from = filteredStats.length ? filteredStats[0].date : (fromEl || todayStr());
  const to = filteredStats.length ? filteredStats[filteredStats.length-1].date : (toEl || todayStr());
  const filled = fillDateGaps(filteredStats, from, to);
  const kpis = calcKPIs(filteredStats);
  document.getElementById('statsSub').textContent = `${listing.title} · ${filteredStats.length} ${plural(filteredStats.length,'запись','записи','записей')}`;

  content.innerHTML = `
    <div class="stats-kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">👁 Показы</div>
        <div class="kpi-value">${kpis ? kpis.totalViews.toLocaleString('ru-RU') : '—'}</div>
        <div style="font-size:12px;color:var(--text3)">ср. ${kpis?.avgViews ?? '—'}/день · макс ${kpis?.maxViews ?? '—'}</div>
        ${kpis ? deltaHtml(kpis.deltaViews) : ''}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">📞 Контакты</div>
        <div class="kpi-value">${kpis ? kpis.totalContacts.toLocaleString('ru-RU') : '—'}</div>
        <div style="font-size:12px;color:var(--text3)">ср. ${kpis?.avgContacts ?? '—'}/день · макс ${kpis?.maxContacts ?? '—'}</div>
        ${kpis ? deltaHtml(kpis.deltaContacts) : ''}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">⭐ Избранное</div>
        <div class="kpi-value">${kpis ? kpis.totalFavorites.toLocaleString('ru-RU') : '—'}</div>
        <div style="font-size:12px;color:var(--text3)">ср. ${kpis?.avgFavorites ?? '—'}/день · макс ${kpis?.maxFavorites ?? '—'}</div>
        ${kpis ? deltaHtml(kpis.deltaFavorites) : ''}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">📊 Конверсия</div>
        <div class="kpi-value" style="font-size:18px;">${kpis && kpis.totalViews > 0 ? ((kpis.totalContacts/kpis.totalViews)*100).toFixed(1)+'%' : '—'}</div>
        <div style="font-size:12px;color:var(--text3)">показ → контакт</div>
        <div style="font-size:12px;color:var(--text3)">${kpis && kpis.totalViews > 0 ? ((kpis.totalFavorites/kpis.totalViews)*100).toFixed(1)+'%' : '—'} показ → избр.</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">Динамика по дням</div>
      <div class="chart-wrap"><canvas id="statsLineChart"></canvas></div>
    </div>
    ${filteredStats.filter(s=>s.note).length > 0 ? `
    <div class="chart-card" style="margin-bottom:16px;">
      <div class="chart-card-title">📝 Заметки за период</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="chart-card">
        <div class="chart-card-title">Среднее по неделям</div>

        <div class="chart-card-title">Дни с продвижением vs без</div>
        <div class="chart-wrap"><canvas id="statsPromoChart"></canvas></div>
      </div>

  // Line chart
  destroyChart(statsChart);
  const labels = filled.map(s => formatDateShort(s.date));
  const datasets = [];
  ['views','contacts','favorites'].forEach(m => {
    if (!statsActiveMetrics.has(m)) return;
    datasets.push({ label:METRIC_LABELS[m], data:filled.map(s=>s[m]), borderColor:METRIC_COLORS[m], backgroundColor:METRIC_COLORS[m]+'18', borderWidth:2, pointRadius:filled.length>60?0:3, pointHoverRadius:5, tension:0.3, fill:false, spanGaps:true });

    if (!statsActiveMetrics.has(m)) return;
    wDs.push({ label:METRIC_LABELS[m], data:weeks.map(w=>w.avg[m]), backgroundColor:METRIC_COLORS[m]+'cc', borderRadius:4, borderSkipped:false });
  });
  statsBarChart2 = new Chart(document.getElementById('statsWeekChart'), { type:'bar', data:{ labels:wLabels, datasets:wDs }, options:{...chartOptions(), plugins:{...chartOptions().plugins, legend:{ display:true, labels:{color:'#9090a0',boxWidth:10,padding:10}}}}});

  // Promo comparison
  const promoDates = new Set();
  (listing.promotions||[]).forEach(p=>{ let d=p.startDate; while(d<=p.endDate){promoDates.add(d);d=shiftDate(d,1);} });
  const promoS = filteredStats.filter(s=>promoDates.has(s.date)&&s.views!==null);
  const normalS = filteredStats.filter(s=>!promoDates.has(s.date)&&s.views!==null);
  const avgK = (arr,k) => arr.length ? Math.round(arr.reduce((s,x)=>s+(x[k]||0),0)/arr.length) : 0;
  new Chart(document.getElementById('statsPromoChart'), { type:'bar',
    data:{ labels:['Показы','Контакты','Избранное'], datasets:[
      { label:'Без продвижения', data:[avgK(normalS,'views'),avgK(normalS,'contacts'),avgK(normalS,'favorites')], backgroundColor:'rgba(96,96,112,0.6)', borderRadius:4, borderSkipped:false },
      { label:'С продвижением', data:[avgK(promoS,'views'),avgK(promoS,'contacts'),avgK(promoS,'favorites')], backgroundColor:'rgba(240,160,32,0.7)', borderRadius:4, borderSkipped:false },
    ]},
    options:{...chartOptions(), plugins:{...chartOptions().plugins, legend:{ display:true, labels:{color:'#9090a0',boxWidth:10,padding:10}}}},
  });
}

function groupByWeek(stats) {
  const weeks = {};
  stats.forEach(s => {
    const d = new Date(s.date);
    const ws = new Date(d); ws.setDate(d.getDate()-d.getDay()+1);
    const key = ws.toISOString().slice(0,10);
    if (!weeks[key]) weeks[key] = { label:formatDateShort(key), items:[] };
    weeks[key].items.push(s);
  });
  return Object.values(weeks).map(w => ({
    label: w.label,
    avg: {
      views: w.items.length ? Math.round(w.items.reduce((s,x)=>s+(x.views||0),0)/w.items.length) : 0,
      contacts: w.items.length ? Math.round(w.items.reduce((s,x)=>s+(x.contacts||0),0)/w.items.length) : 0,
      favorites: w.items.length ? Math.round(w.items.reduce((s,x)=>s+(x.favorites||0),0)/w.items.length) : 0,
    }
  }));
}

function formatDateShort(str) {
  if (!str) return '';
  const [,m,d] = str.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${+d} ${months[+m-1]}`;
}

function chartOptions() {
  return {
    responsive:true, maintainAspectRatio:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{
      legend:{display:false},
      tooltip:{ backgroundColor:'#1e1e24', borderColor:'rgba(255,255,255,0.1)', borderWidth:1, titleColor:'#f0f0f2', bodyColor:'#9090a0', padding:10, cornerRadius:8 },
    },
    scales:{
      x:{ grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#606070',maxTicksLimit:12}, border:{color:'rgba(255,255,255,0.07)'} },
      y:{ grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#606070'}, border:{color:'rgba(255,255,255,0.07)'}, beginAtZero:true },
    },
  };
}

function destroyChart(c) { if (c) { try { c.destroy(); } catch(e) {} } }

  container.innerHTML = (region.listings||[]).map((l,i) => {

      <span class="compare-color-dot" style="background:${color}"></span>${esc(l.title)}

function toggleCompareListing(id, idx, checkbox) {
  const label = checkbox.closest('.compare-listing-check');
  const color = CHART_COLORS[idx%CHART_COLORS.length];
  if (checkbox.checked) { compareSelectedListings.add(id); label.classList.add('selected'); label.style.borderColor=color; label.style.background=color+'18'; }
  else { compareSelectedListings.delete(id); label.classList.remove('selected'); label.style.borderColor=''; label.style.background=''; }
  renderCompare();
}

function setComparePeriod(days, btn) {

}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function plural(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 19) return `${n} ${many}`;
  if (mod10 === 1) return `${n} ${one}`;
  if (mod10 >= 2 && mod10 <= 4) return `${n} ${few}`;
  return `${n} ${many}`;
}

let analyticsPeriod = 30;
let analyticsChart1 = null;
let analyticsChart2 = null;

function setAnalyticsPeriod(days, btn) {
  analyticsPeriod = days;
  document.querySelectorAll('#analyticsPeriodTabs .period-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

}

function renderAnalytics() {
  const region = getCurrentRegion();
  const content = document.getElementById('analyticsContent');
  if (!region) return;

  const allListings = region.listings || [];
  if (allListings.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <h3>Нет данных</h3><p>Добавьте объявления и начните вводить ежедневные данные</p>
      <button class="btn btn-primary" onclick="navigate('listings')">К объявлениям</button>
    </div>`;
    return;
  }

  const { from, to } = getDateRange(analyticsPeriod);

  // ── Собираем данные по каждому объявлению ──
  const listingStats = allListings.map((l, idx) => {
    const filtered = filterStatsByPeriod(l.stats || [], analyticsPeriod, from, to);
    const kpis = calcKPIs(filtered);
    const totalCost = (l.promotions || [])
      .filter(p => !from || (p.endDate >= from && p.startDate <= to))
      .reduce((s, p) => s + (p.cost || 0), 0);
    const promoDays = new Set();
    (l.promotions || []).filter(p => !from || (p.endDate >= from && p.startDate <= to))
      .forEach(p => { let d = p.startDate; while (d <= p.endDate) { promoDays.add(d); d = shiftDate(d, 1); } });
    const promoStats = filtered.filter(s => promoDays.has(s.date) && s.views !== null);
    const normalStats = filtered.filter(s => !promoDays.has(s.date) && s.views !== null);
    const avgPromoViews = promoStats.length ? promoStats.reduce((s,x)=>s+(x.views||0),0)/promoStats.length : 0;
    const avgNormalViews = normalStats.length ? normalStats.reduce((s,x)=>s+(x.views||0),0)/normalStats.length : 0;
    const promoLift = avgNormalViews > 0 ? ((avgPromoViews - avgNormalViews) / avgNormalViews * 100) : null;
    const costPerContact = kpis && kpis.totalContacts > 0 && totalCost > 0 ? (totalCost / kpis.totalContacts) : null;
    const convRate = kpis && kpis.totalViews > 0 ? (kpis.totalContacts / kpis.totalViews * 100) : 0;
    const favRate = kpis && kpis.totalViews > 0 ? (kpis.totalFavorites / kpis.totalViews * 100) : 0;
    return { listing: l, kpis, filtered, totalCost, promoLift, costPerContact, convRate, favRate, color: CHART_COLORS[idx % CHART_COLORS.length] };
  });

  // ── Общие KPI региона ──
  const totalViews = listingStats.reduce((s, x) => s + (x.kpis?.totalViews || 0), 0);
  const totalContacts = listingStats.reduce((s, x) => s + (x.kpis?.totalContacts || 0), 0);
  const totalFavs = listingStats.reduce((s, x) => s + (x.kpis?.totalFavorites || 0), 0);
  const totalSpend = listingStats.reduce((s, x) => s + x.totalCost, 0);
  const avgConv = totalViews > 0 ? (totalContacts / totalViews * 100) : 0;
  const withData = listingStats.filter(x => x.kpis && x.kpis.days > 0);

  // ── Лучшие/худшие ──
  const byViews = [...listingStats].filter(x=>x.kpis).sort((a,b)=>(b.kpis.totalViews||0)-(a.kpis.totalViews||0));
  const byContacts = [...listingStats].filter(x=>x.kpis).sort((a,b)=>(b.kpis.totalContacts||0)-(a.kpis.totalContacts||0));
  const byConv = [...listingStats].filter(x=>x.kpis&&x.kpis.totalViews>0).sort((a,b)=>b.convRate-a.convRate);
  const byFav = [...listingStats].filter(x=>x.kpis).sort((a,b)=>(b.kpis.totalFavorites||0)-(a.kpis.totalFavorites||0));

  // ── Тренды (первая половина vs вторая) ──
  const trendHtml = (val) => {
    if (val === null) return `<span class="trend-badge trend-flat">—</span>`;
    if (val > 5) return `<span class="trend-badge trend-up">↑ ${val}%</span>`;
    if (val < -5) return `<span class="trend-badge trend-down">↓ ${Math.abs(val)}%</span>`;
    return `<span class="trend-badge trend-flat">→ ${val}%</span>`;
  };

  // ── Лучший тип продвижения ──
  const promoTypeStats = { x2: { totalLift: 0, count: 0 }, x5: { totalLift: 0, count: 0 }, x10: { totalLift: 0, count: 0 } };
  listingStats.forEach(({ listing, filtered }) => {
    ['x2','x5','x10'].forEach(type => {
      const typeDays = new Set();
      (listing.promotions||[]).filter(p=>p.type===type&&(!from||(p.endDate>=from&&p.startDate<=to)))
        .forEach(p=>{ let d=p.startDate; while(d<=p.endDate){typeDays.add(d);d=shiftDate(d,1);} });
      const ts = filtered.filter(s=>typeDays.has(s.date)&&s.views!==null);
      const ns = filtered.filter(s=>!typeDays.has(s.date)&&s.views!==null);
      if (ts.length > 0 && ns.length > 0) {
        const avgT = ts.reduce((s,x)=>s+(x.views||0),0)/ts.length;
        const avgN = ns.reduce((s,x)=>s+(x.views||0),0)/ns.length;
        if (avgN > 0) { promoTypeStats[type].totalLift += (avgT-avgN)/avgN*100; promoTypeStats[type].count++; }
      }
    });
  });
  const bestPromoType = Object.entries(promoTypeStats)
    .filter(([,v])=>v.count>0)
    .sort((a,b)=>(b[1].totalLift/b[1].count)-(a[1].totalLift/a[1].count))[0];

  // ── Тепловая карта активности ──
  function buildHeatmap(listingStats) {
    const allDates = {};
    listingStats.forEach(({ filtered }) => {
      filtered.forEach(s => {
        if (!allDates[s.date]) allDates[s.date] = 0;
        allDates[s.date] += (s.views || 0);
      });
    });
    // last 16 weeks (112 days)
    const endDate = todayStr();
    const startDate = shiftDate(endDate, -111);
    const vals = [];
    let d = startDate;
    while (d <= endDate) { vals.push(allDates[d] || 0); d = shiftDate(d, 1); }
    const maxVal = Math.max(...vals, 1);
    const level = v => { if (!v) return ''; if (v < maxVal*0.25) return 'l1'; if (v < maxVal*0.5) return 'l2'; if (v < maxVal*0.75) return 'l3'; return 'l4'; };

    // group into weeks (cols), days of week (rows)
    const weeks = [];
    let cur = startDate;
    // align to Monday
    const startD = new Date(startDate);
    const dow = startD.getDay();
    const alignOffset = dow === 0 ? 6 : dow - 1;
    cur = shiftDate(startDate, -alignOffset);
    while (cur <= endDate) {
      const week = [];
      for (let i = 0; i < 7; i++) {
        const dd = shiftDate(cur, i);
        week.push({ date: dd, val: allDates[dd] || 0, inRange: dd >= startDate && dd <= endDate });
      }
      weeks.push(week);
      cur = shiftDate(cur, 7);
    }

    const monthLabels = weeks.map(w => {
      const d = new Date(w[0].date);
      return d.getDate() <= 7 ? ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()] : '';
    });

    return `
      <div class="heatmap-wrap">
        <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;">Активность ввода данных (16 недель)</div>
        <div class="heatmap-month-row">${monthLabels.map(l=>`<div class="heatmap-month-label">${l}</div>`).join('')}</div>
        <div class="heatmap-grid">
          ${weeks.map((w,wi) => `<div class="heatmap-col">
            ${w.map(cell => cell.inRange
              ? `<div class="heatmap-cell ${level(cell.val)}" title="${cell.date}: ${cell.val} показов"></div>`
              : `<div class="heatmap-cell" style="opacity:0"></div>`
            ).join('')}
          </div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--text3);">
          Меньше
          <div style="display:flex;gap:3px;">
            <div style="width:12px;height:12px;border-radius:2px;background:var(--bg3)"></div>
            <div style="width:12px;height:12px;border-radius:2px;" class="heatmap-cell l1"></div>
            <div style="width:12px;height:12px;border-radius:2px;" class="heatmap-cell l2"></div>
            <div style="width:12px;height:12px;border-radius:2px;" class="heatmap-cell l3"></div>
            <div style="width:12px;height:12px;border-radius:2px;" class="heatmap-cell l4"></div>
          </div>
          Больше
        </div>
      </div>`;
  }

  function topTable(title, items, valFn, labelFn, color) {
    if (items.length === 0) return '';
    const maxVal = Math.max(...items.map(valFn), 1);
    const ranks = ['🥇','🥈','🥉'];
    return `<div class="top-table">
      <div class="top-table-title">${title}</div>
      ${items.slice(0,5).map((item,i)=>{
        const val = valFn(item);
        const pct = Math.round(val/maxVal*100);
        return `<div class="top-row">
          <div class="top-rank">${ranks[i]||i+1}</div>
          <div class="top-name">${esc(item.listing.title)}</div>
          <div class="top-bar-wrap"><div class="top-bar" style="width:${pct}%;background:${color||'var(--accent)'}"></div></div>
          <div class="top-val">${labelFn(val)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  function roiTable() {
    const rows = listingStats.filter(x=>x.kpis).map(({listing,kpis,totalCost,costPerContact,convRate,promoLift,color})=>{
      const cpc = costPerContact ? `${Math.round(costPerContact).toLocaleString('ru-RU')} ₽` : '—';
      const lift = promoLift !== null ? `${promoLift>0?'+':''}${Math.round(promoLift)}%` : '—';
      const liftClass = promoLift===null?'roi-neutral':promoLift>0?'roi-positive':'roi-negative';
      return `<div class="roi-row">
        <div style="font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(listing.title)}</span>
        </div>
        <div style="font-family:var(--mono);color:var(--text2)">${totalCost>0?totalCost.toLocaleString('ru-RU')+' ₽':'—'}</div>
        <div style="font-family:var(--mono);color:var(--text2)">${kpis.totalContacts.toLocaleString('ru-RU')}</div>
        <div style="font-family:var(--mono);color:var(--text2)">${convRate.toFixed(1)}%</div>
        <div style="font-family:var(--mono)">${cpc}</div>
        <div class="${liftClass};font-family:var(--mono)">${lift}</div>
      </div>`;
    });
    if (!rows.length) return '';
    return `<div class="roi-table">
      <div class="roi-row roi-head" style="padding:10px 16px;">
        <div>Объявление</div><div>Затраты</div><div>Контакты</div><div>Конверсия</div><div>₽/контакт</div><div>Буст ×</div>
      </div>
      ${rows.join('')}
    </div>`;
  }

  // ── Сборка страницы ──
  document.getElementById('analyticsSub').textContent = `${region.name} · ${allListings.length} ${plural(allListings.length,'объявление','объявления','объявлений')}`;

  content.innerHTML = `

    <!-- Сводные KPI -->
    <div class="analytics-section">
      <div class="analytics-section-title">Сводка по региону</div>
      <div class="insight-grid">
        <div class="insight-card highlight">
          <div class="insight-icon">👁</div>
          <div class="insight-body">
            <div class="insight-label">Всего показов</div>
            <div class="insight-value">${totalViews.toLocaleString('ru-RU')}</div>
            <div class="insight-sub">ср. ${totalViews&&withData.length?Math.round(totalViews/Math.max(1,...withData.map(x=>x.kpis.days))).toLocaleString('ru-RU'):0}/день по всем</div>
          </div>
        </div>
        <div class="insight-card">
          <div class="insight-icon">📞</div>
          <div class="insight-body">
            <div class="insight-label">Всего контактов</div>
            <div class="insight-value">${totalContacts.toLocaleString('ru-RU')}</div>
            <div class="insight-sub">конверсия ${avgConv.toFixed(1)}%</div>
          </div>
        </div>
        <div class="insight-card">
          <div class="insight-icon">⭐</div>
          <div class="insight-body">
            <div class="insight-label">В избранное</div>
            <div class="insight-value">${totalFavs.toLocaleString('ru-RU')}</div>
            <div class="insight-sub">${totalViews>0?((totalFavs/totalViews)*100).toFixed(1):0}% от показов</div>
          </div>
        </div>
        <div class="insight-card ${totalSpend>0?'warn':''}">
          <div class="insight-icon">💰</div>
          <div class="insight-body">
            <div class="insight-label">Затраты на продвижение</div>
            <div class="insight-value">${totalSpend>0?totalSpend.toLocaleString('ru-RU')+' ₽':'—'}</div>
            <div class="insight-sub">${totalSpend>0&&totalContacts>0?'₽/контакт: '+Math.round(totalSpend/totalContacts).toLocaleString('ru-RU'):'Нет данных о продвижении'}</div>
          </div>
        </div>
        ${bestPromoType ? `
        <div class="insight-card highlight">
          <div class="insight-icon">🚀</div>
          <div class="insight-body">
            <div class="insight-label">Лучший тип продвижения</div>
            <div class="insight-value">${bestPromoType[0].replace('x','×')}</div>
            <div class="insight-sub">+${Math.round(bestPromoType[1].totalLift/bestPromoType[1].count)}% к показам в среднем</div>
          </div>
        </div>` : ''}
        <div class="insight-card">
          <div class="insight-icon">📊</div>
          <div class="insight-body">
            <div class="insight-label">Объявлений с данными</div>
            <div class="insight-value">${withData.length} / ${allListings.length}</div>
            <div class="insight-sub">${allListings.length-withData.length>0?`${allListings.length-withData.length} без данных за период`:'Все объявления заполнены'}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Тренды -->
    ${withData.length>0?`
    <div class="analytics-section">
      <div class="analytics-section-title">Тренды объявлений</div>
      <div class="insight-grid">
        ${withData.map(({listing,kpis,color})=>`
          <div class="insight-card">
            <div class="insight-body">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></span>
                <div class="insight-label" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(listing.title)}</div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <span style="font-size:11px;color:var(--text3)">Показы:</span> ${trendHtml(kpis.deltaViews)}
                <span style="font-size:11px;color:var(--text3)">Контакты:</span> ${trendHtml(kpis.deltaContacts)}
              </div>
              <div style="font-size:11px;color:var(--text3);margin-top:6px;">
                Конв. ${((kpis.totalContacts/Math.max(kpis.totalViews,1))*100).toFixed(1)}% · Изб. ${((kpis.totalFavorites/Math.max(kpis.totalViews,1))*100).toFixed(1)}%
              </div>
            </div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Топы -->
    <div class="analytics-section">
      <div class="analytics-section-title">Рейтинги объявлений</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        ${topTable('🏆 Топ по показам', byViews, x=>x.kpis?.totalViews||0, v=>v.toLocaleString('ru-RU'), '#00c896')}
        ${topTable('📞 Топ по контактам', byContacts, x=>x.kpis?.totalContacts||0, v=>v.toLocaleString('ru-RU'), '#4a9eff')}
        ${topTable('🎯 Топ по конверсии', byConv, x=>x.convRate, v=>v.toFixed(1)+'%', '#a78bfa')}
        ${topTable('⭐ Топ по избранному', byFav, x=>x.kpis?.totalFavorites||0, v=>v.toLocaleString('ru-RU'), '#f0a020')}
      </div>
    </div>

    <!-- ROI продвижений -->
    <div class="analytics-section">
      <div class="analytics-section-title">ROI продвижений</div>
      ${roiTable()}
    </div>

    <!-- Визуал: конверсии на scatter + динамика по всем -->
    <div class="analytics-section">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
        <div class="chart-card">
          <div class="chart-card-title">Распределение конверсий</div>
          <div class="chart-wrap"><canvas id="analyticsConvChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-card-title">Суммарная динамика региона</div>
          <div class="chart-wrap"><canvas id="analyticsRegionChart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Тепловая карта -->
    <div class="analytics-section">
      <div class="analytics-section-title">Карта активности ввода</div>
      ${buildHeatmap(listingStats)}
    </div>`;

  // ── Строим графики ──
  initChartDefaults();
  destroyChart(analyticsChart1);
  destroyChart(analyticsChart2);

  // Конверсии bar chart
  analyticsChart1 = new Chart(document.getElementById('analyticsConvChart'), {
    type: 'bar',
    data: {
      labels: listingStats.filter(x=>x.kpis).map(({listing})=>listing.title.length>16?listing.title.slice(0,16)+'…':listing.title),
      datasets: [
        { label: 'Показ→Контакт %', data: listingStats.filter(x=>x.kpis).map(x=>+x.convRate.toFixed(1)), backgroundColor: '#4a9effcc', borderRadius:4, borderSkipped:false },
        { label: 'Показ→Избранное %', data: listingStats.filter(x=>x.kpis).map(x=>+x.favRate.toFixed(1)), backgroundColor: '#f0a020cc', borderRadius:4, borderSkipped:false },
      ],
    },
    options: { ...chartOptions(), plugins: { ...chartOptions().plugins, legend: { display:true, labels:{color:'#9090a0',boxWidth:10,padding:10} } } },
  });

  // Суммарная динамика по дням
  const allDatesSet2 = new Set();
  listingStats.forEach(({filtered}) => filtered.forEach(s => allDatesSet2.add(s.date)));
  const allDates2 = [...allDatesSet2].sort();
  const regionViewsByDay = allDates2.map(d => {
    return listingStats.reduce((s,{filtered})=>{
      const found = filtered.find(x=>x.date===d);
      return s + (found?.views||0);
    },0);
  });
  const regionContactsByDay = allDates2.map(d => {
    return listingStats.reduce((s,{filtered})=>{
      const found = filtered.find(x=>x.date===d);
      return s + (found?.contacts||0);
    },0);
  });

  analyticsChart2 = new Chart(document.getElementById('analyticsRegionChart'), {
    type: 'line',
    data: {
      labels: allDates2.map(d=>formatDateShort(d)),
      datasets: [
        { label:'Показы', data:regionViewsByDay, borderColor:'#00c896', backgroundColor:'#00c89618', borderWidth:2, tension:0.3, pointRadius:allDates2.length>60?0:2, fill:true, spanGaps:true },
        { label:'Контакты', data:regionContactsByDay, borderColor:'#4a9eff', backgroundColor:'transparent', borderWidth:2, tension:0.3, pointRadius:allDates2.length>60?0:2, spanGaps:true },
      ],
    },
    options: { ...chartOptions(), plugins: { ...chartOptions().plugins, legend:{ display:true, labels:{color:'#9090a0',boxWidth:10,padding:10} } } },
  });
}

// ─── STEP 5: CLOUD SYNC + PWA ───

const CLOUD_CONFIG_KEY = 'avitoTrackerCloud';

let cloudConfig = {
  cfUrl: '',
  autoSync: false,
  lastSync: null,
};

function loadCloudConfig() {
  try {
    const saved = localStorage.getItem(CLOUD_CONFIG_KEY);
    if (saved) cloudConfig = { ...cloudConfig, ...JSON.parse(saved) };
  } catch(e) {}
  applyCloudConfig();
}

function applyCloudConfig() {
  const cfUrlEl = document.getElementById('cfUrl');
  const autoToggle = document.getElementById('autoSyncToggle');
  const autoLabel = document.getElementById('autoSyncLabel');
  if (cfUrlEl) cfUrlEl.value = cloudConfig.cfUrl || '';
  if (autoToggle) { autoToggle.checked = cloudConfig.autoSync; autoLabel.textContent = cloudConfig.autoSync ? 'Вкл' : 'Выкл'; }
  updateSyncStatus();
}

function saveCloudConfig() {
  const url = document.getElementById('cfUrl')?.value.trim() || '';
  cloudConfig.cfUrl = url;
  localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
  const badge = document.getElementById('configSavedBadge');
  if (badge) { badge.classList.add('show'); setTimeout(() => badge.classList.remove('show'), 2000); }
  updateSyncStatus();
  if (url) syncNow();
}

function toggleAutoSync(val) {
  cloudConfig.autoSync = val;
  localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
  document.getElementById('autoSyncLabel').textContent = val ? 'Вкл' : 'Выкл';
}

function updateSyncStatus() {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const statusText = document.getElementById('cloudStatusText');
  const statusDot = document.getElementById('cloudStatusDot');
  const lastSyncText = document.getElementById('lastSyncText');

  const hasCloud = !!cloudConfig.cfUrl;
  const lastSync = cloudConfig.lastSync ? new Date(cloudConfig.lastSync) : null;
  const lastSyncStr = lastSync ? lastSync.toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

  if (lastSyncText) lastSyncText.textContent = lastSyncStr;

  if (!hasCloud) {
    if (dot) { dot.className = 'sync-dot'; }
    if (label) label.textContent = 'локально';
    if (statusText) statusText.textContent = 'Не настроено — работает локально';
    if (statusDot) statusDot.className = 'sync-dot';
  } else {
    if (dot) dot.className = 'sync-dot ok';
    if (label) label.textContent = lastSync ? 'синхр. ' + lastSyncStr : 'не синхр.';
    if (statusText) statusText.textContent = 'Подключено: ' + cloudConfig.cfUrl.slice(0, 40) + '…';
    if (statusDot) statusDot.className = 'sync-dot ok';
  }
}

let isSyncing = false;

async function syncNow() {
  if (!cloudConfig.cfUrl) { showToast('Укажите URL Cloud Function в настройках'); navigate('settings'); return; }
  if (isSyncing) return;
  isSyncing = true;

  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const btn = document.getElementById('syncBtn');
  if (dot) dot.className = 'sync-dot syncing';
  if (label) label.textContent = 'синхр…';
  if (btn) btn.disabled = true;

  try {
    // 1. Получаем данные с сервера
    const getResp = await fetch(cloudConfig.cfUrl + '?action=get', {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' },
    });

    if (!getResp.ok) throw new Error(`HTTP ${getResp.status}`);
    const serverData = await getResp.json();

    // 2. Мёрдж: объединяем регионы сервера и локальные
    if (serverData && serverData.regions) {
      const merged = mergeStates(state, serverData);
      state = merged;
      saveState();
    }

    // 3. Отправляем актуальное состояние на сервер
    const putResp = await fetch(cloudConfig.cfUrl + '?action=set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...state, _syncedAt: new Date().toISOString() }),
    });

    if (!putResp.ok) throw new Error(`HTTP ${putResp.status}`);

    cloudConfig.lastSync = new Date().toISOString();
    localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));

    // Обновляем UI
    renderRegionSelect();
    renderListings();
    updateSyncStatus();
    showToast('✓ Синхронизация выполнена');

  } catch(err) {
    if (dot) dot.className = 'sync-dot error';
    if (label) label.textContent = 'ошибка';
    showToast('Ошибка синхронизации: ' + err.message);
    console.error('Sync error:', err);
  } finally {
    isSyncing = false;
    if (btn) btn.disabled = false;
    setTimeout(() => updateSyncStatus(), 3000);
  }
}

async function testCloudConnection() {
  const url = document.getElementById('cfUrl')?.value.trim();
  if (!url) { showToast('Введите URL Cloud Function'); return; }
  showToast('Проверяю соединение…');
  try {
    const resp = await fetch(url + '?action=ping', { method: 'GET' });
    if (resp.ok) showToast('✓ Соединение успешно!');
    else showToast('Ошибка: сервер вернул ' + resp.status);
  } catch(e) {
    showToast('Не удалось подключиться: ' + e.message);
  }
}

// Умный мёрдж двух состояний: побеждают более новые данные
function mergeStates(local, remote) {
  if (!remote || !remote.regions) return local;
  const merged = { ...local };
  const localRegMap = Object.fromEntries(local.regions.map(r => [r.id, r]));
  const remoteRegMap = Object.fromEntries(remote.regions.map(r => [r.id, r]));
  const allRegIds = new Set([...Object.keys(localRegMap), ...Object.keys(remoteRegMap)]);
  merged.regions = [...allRegIds].map(rid => {
    const lr = localRegMap[rid];
    const rr = remoteRegMap[rid];
    if (!lr) return rr;
    if (!rr) return lr;
    // Мёрдж объявлений внутри региона
    const localListMap = Object.fromEntries((lr.listings||[]).map(l => [l.id, l]));
    const remoteListMap = Object.fromEntries((rr.listings||[]).map(l => [l.id, l]));
    const allListIds = new Set([...Object.keys(localListMap), ...Object.keys(remoteListMap)]);
    const mergedListings = [...allListIds].map(lid => {
      const ll = localListMap[lid];
      const rl = remoteListMap[lid];
      if (!ll) return rl;
      if (!rl) return ll;
      // Мёрдж статистики: объединяем по датам, локальная приоритетнее
      const statsMap = {};
      (rl.stats||[]).forEach(s => statsMap[s.date] = s);
      (ll.stats||[]).forEach(s => statsMap[s.date] = s); // локальная перезаписывает
      // Мёрдж продвижений: по id, объединяем уникальные
      const promoMap = {};
      (rl.promotions||[]).forEach(p => promoMap[p.id] = p);
      (ll.promotions||[]).forEach(p => promoMap[p.id] = p);
      return { ...rl, ...ll, stats: Object.values(statsMap).sort((a,b)=>a.date.localeCompare(b.date)), promotions: Object.values(promoMap) };
    });
    return { ...rr, ...lr, listings: mergedListings };
  });
  return merged;
}

// Автосинхронизация при сохранении
const _origSaveState = saveState;
function saveState() {
  localStorage.setItem('avitoTracker', JSON.stringify(state));
  if (cloudConfig.autoSync && cloudConfig.cfUrl) {
    clearTimeout(saveState._debounce);
    saveState._debounce = setTimeout(() => syncNow(), 2000);
  }
}

// ─── PWA: Service Worker ───
function registerSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW error:', err));
  }
}

// ─── INIT ───
function init() {
  loadState();
  loadCloudConfig();
  renderRegionSelect();
  const r = getCurrentRegion();
  document.getElementById('topbarRegion').textContent = r ? r.name : '';
  renderListings();
  renderRegions();
  registerSW();
}
